services:
  backend:
    build:
      context: /home/runner/work/real-time-chat/real-time-chat/backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: /home/runner/work/real-time-chat/real-time-chat/frontend
    environment:
      NEXT_PUBLIC_WS_URL: http://localhost:8000/ws-chat
    ports:
      - "3000:3000"
    depends_on:
      - backend
